<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>甄嬛 MBTI 改命局 · 手机版 Demo</title>
    <meta
      name="description"
      content="手机竖屏互动剧情 demo：用甄嬛传名场面模拟 MBTI / 荣格功能栈选择路径，生成可分享的人格契合度报告。"
    />
    <meta property="og:title" content="甄嬛 MBTI 改命局 · 手机版" />
    <meta
      property="og:description"
      content="竖屏版：选现在的你和想成为的宫斗人格，十轮名场面后生成 MBTI 契合度雷达报告。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./assets/zhenhuan-bg.png" />
    <meta name="theme-color" content="#461018" />
    <link rel="stylesheet" href="./mobile.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="screen menu-screen is-active" data-screen="menu">
        <div class="scene-bg" aria-hidden="true"></div>
        <div class="menu-shade" aria-hidden="true"></div>

        <div class="menu-layout">
          <section class="intro-board">
            <p class="seal">竖屏名场面训练</p>
            <h1>甄嬛 MBTI 改命局</h1>
            <p class="menu-copy">
              选“现在的你”和“想成为的宫斗人格”。每一幕结束后，用 MBTI / 荣格功能栈解释：目标人格为什么更可能那样选。
            </p>
            <button class="start-btn" id="startBtn" type="button">进入十轮名场面</button>
          </section>

          <section class="selector-board">
            <div class="section-title">
              <span>现在的你</span>
              <small>初始 MBTI</small>
            </div>
            <div class="type-chip-grid" id="currentTypeGrid"></div>

            <div class="section-title target-title">
              <span>想成为谁</span>
              <small>16 型人物</small>
            </div>
            <div class="target-grid" id="targetGrid"></div>
          </section>
        </div>
      </section>

      <section class="screen play-screen" data-screen="play">
        <div class="scene-bg" id="playSceneBg" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>

        <header class="hud">
          <button class="icon-btn" id="menuBtn" type="button" aria-label="返回菜单">‹</button>
          <div class="chapter-tag">
            <span id="chapterName">第一轮</span>
            <strong id="sceneName"></strong>
          </div>
          <div class="stat-strip" id="statStrip"></div>
        </header>

        <aside class="goal-card parchment-card">
          <div class="avatar atlas-avatar" id="goalAvatar" aria-hidden="true"></div>
          <div>
            <span>目标人格</span>
            <strong id="goalName"></strong>
            <p id="goalTrait"></p>
          </div>
        </aside>

        <aside class="analysis-panel parchment-card" id="analysisPanel" hidden>
          <div class="analysis-head">
            <span id="analysisVerdict">分支解析</span>
            <strong id="analysisScore"></strong>
          </div>
          <div class="analysis-body" id="analysisBody"></div>
        </aside>

        <div class="palace-plaque" id="palacePlaque">储秀宫</div>

        <div class="sprite-stage" id="spriteStage">
          <img class="sprite" id="sprite-zhenhuan" src="./assets/sprite-zhenhuan.png" alt="甄嬛立绘" />
          <img class="sprite" id="sprite-anlingrong" src="./assets/sprite-anlingrong.png" alt="安陵容立绘" />
          <img class="sprite" id="sprite-huafei" src="./assets/sprite-huafei.png" alt="华妃立绘" />
          <img class="sprite" id="sprite-emperor" src="./assets/sprite-emperor.png" alt="皇上立绘" />
        </div>

        <div class="feedback-toast" id="feedbackToast" aria-live="polite"></div>

        <section class="dialogue-window">
          <div class="speaker-row">
            <div class="avatar atlas-avatar" id="speakerAvatar" aria-hidden="true"></div>
            <div>
              <div class="nameplate" id="speakerName">旁白</div>
              <p class="round-tag" id="roundTag"></p>
            </div>
          </div>
          <p class="dialogue-text" id="dialogueText"></p>
          <div class="choice-panel" id="choicePanel" hidden></div>
          <button class="next-btn" id="nextBtn" type="button">继续</button>
        </section>
      </section>

      <section class="screen report-screen" data-screen="report">
        <div class="scene-bg" aria-hidden="true"></div>
        <div class="menu-shade" aria-hidden="true"></div>

        <div class="report-layout">
          <section class="share-card" id="shareCard">
            <div class="report-hero">
              <div class="avatar report-avatar atlas-avatar" id="reportAvatar" aria-hidden="true"></div>
              <div>
                <p class="seal">可视化报告</p>
                <h2 id="reportTitle"></h2>
                <p id="reportSubtitle"></p>
              </div>
            </div>

            <div class="compat-ring">
              <div>
                <strong id="compatScore">0%</strong>
                <span>目标人格契合度</span>
              </div>
            </div>
          </section>

          <section class="radar-card">
            <div class="section-title">
              <span>荣格功能雷达</span>
              <small>本局 vs 目标</small>
            </div>
            <div class="radar-chart" id="radarBars"></div>
            <p class="share-line" id="shareLine"></p>
          </section>

          <section class="recap-board">
            <div class="section-title">
              <span>十轮选择回放</span>
              <small>名场面差距</small>
            </div>
            <div class="recap-list" id="recapList"></div>
            <div class="growth-box" id="growthBox"></div>
            <div class="ending-actions">
              <button class="ghost-btn" id="copyLinkBtn" type="button">复制分享链接</button>
              <button class="start-btn" id="againBtn" type="button">再测一局</button>
            </div>
            <p class="copy-status" id="copyStatus"></p>
          </section>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
